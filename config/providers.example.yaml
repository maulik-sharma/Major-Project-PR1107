# ModelMesh Providers and Models Configuration
# Example configuration showing multi-provider routing and endpoints

providers:
  # catalog: how Settings → Endpoints → Check Provider Models reads each provider's
  # live model list (format, url, free_only / assume_free, include / exclude globs).
  - id: groq
    protocol: openai_compat
    base_url: https://api.groq.com/openai/v1
    auth_env:
      - GROQ_API_KEY
    catalog:
      format: openai
      assume_free: true    # free plan: every model costs $0 (rate limits still apply)
      exclude: ["whisper*", "*prompt-guard*", "*safeguard*", "canopylabs/*"]

  - id: openrouter
    protocol: openai_compat
    base_url: https://openrouter.ai/api/v1
    auth_env:
      - OPENROUTER_API_KEY
    catalog:
      format: openai
      free_only: true      # offer only models priced $0 (the ":free" variants)
      exclude: ["openrouter/*", "*content-safety*"]

  - id: gemini
    protocol: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    auth_env:
      - GEMINI_API_KEY
    catalog:
      format: gemini
      url: https://generativelanguage.googleapis.com/v1beta/models
      include: ["gemini-*", "gemma-*"]
      exclude: ["*tts*", "*image*", "*embedding*", "*live*", "*audio*", "*transcribe*", "*robotics*",
                "*computer-use*", "*customtools*", "*-latest", "*nano-banana*", "*omni*"]

  - id: openai
    protocol: openai_compat
    base_url: https://api.openai.com/v1
    auth_env:
      - OPENAI_API_KEY
    catalog:
      format: openai
      include: ["gpt-*", "o[0-9]*"]
      exclude: ["gpt-3.5*", "gpt-4*", "*-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]", "*audio*", "*realtime*",
                "*search*", "*transcribe*", "*tts*", "*image*", "gpt-live*", "*instruct*"]

  - id: anthropic
    protocol: anthropic
    base_url: https://api.anthropic.com
    auth_env:
      - ANTHROPIC_API_KEY
    catalog:
      format: anthropic

  - id: ollama
    protocol: openai_compat
    base_url: http://localhost:11434/v1
    auth_env: []

  - id: mock
    protocol: mock
    auth_env: []

models:
  # Multi-endpoint open-weight model: demonstrates cross-provider routing and failover
  - id: llama-fast
    display_name: "Llama 3.1 8B (Multi-Provider)"
    tier: cheap
    context_window: 131072
    max_output: 8192
    capabilities:
      - streaming
      - tools
    local: false
    enabled: true
    endpoint_policy: priority
    endpoints:
      - id: llama-fast@groq
        provider: groq
        api_model: "llama-3.1-8b-instant"
        price_in_per_mtok: 0.05
        price_out_per_mtok: 0.08
        priority: 1
        enabled: true
      - id: llama-fast@openrouter
        provider: openrouter
        api_model: "meta-llama/llama-3.1-8b-instruct"
        price_in_per_mtok: 0.06
        price_out_per_mtok: 0.09
        priority: 2
        enabled: true
      - id: llama-fast@ollama
        provider: ollama
        api_model: "llama3.1:8b"
        price_in_per_mtok: 0.0
        price_out_per_mtok: 0.0
        priority: 3
        enabled: true

  # Mid-tier Claude model
  - id: claude-mid
    display_name: "Claude Sonnet 5.5"
    tier: mid
    context_window: 1000000
    max_output: 8192
    capabilities:
      - streaming
      - tools
      - vision
      - reasoning
    local: false
    enabled: true
    endpoint_policy: priority
    endpoints:
      - id: claude-mid@anthropic
        provider: anthropic
        api_model: "claude-sonnet-5-5"
        price_in_per_mtok: 3.00
        price_out_per_mtok: 15.00
        priority: 1
        enabled: true
    # Links to score sources (Settings > Scores > Auto-match Links fills these in).
    # aa_slug: Artificial Analysis slug; arena_name: LMArena model name, exactly as listed.
    scores:
      aa_slug: claude-sonnet-5-5
      arena_name: "Claude Sonnet 5.5 (xHigh)"

  # Google Gemini Flash
  - id: gemini-flash
    display_name: "Google Gemini 3.8 Flash"
    tier: cheap
    context_window: 1000000
    max_output: 8192
    capabilities:
      - streaming
      - tools
      - vision
    local: false
    enabled: true
    endpoint_policy: priority
    endpoints:
      - id: gemini-flash@gemini
        provider: gemini
        api_model: "gemini-flash-latest"
        price_in_per_mtok: 0.075
        price_out_per_mtok: 0.30
        priority: 1
        enabled: true

  # Mock models for testing and offline demo
  - id: mock-fast
    display_name: "Mock Fast Model"
    tier: cheap
    context_window: 32000
    max_output: 4096
    capabilities:
      - streaming
      - tools
      - vision
    local: true
    enabled: true
    endpoint_policy: priority
    endpoints:
      - id: mock-fast@mock
        provider: mock
        api_model: "mock-instant"
        price_in_per_mtok: 0.01
        price_out_per_mtok: 0.02
        priority: 1
        enabled: true

  - id: mock-smart
    display_name: "Mock Smart / Reasoning Model"
    tier: premium
    context_window: 128000
    max_output: 8192
    capabilities:
      - streaming
      - tools
      - reasoning
      - vision
    local: true
    enabled: true
    endpoint_policy: priority
    endpoints:
      - id: mock-smart@mock
        provider: mock
        api_model: "mock-reasoning"
        price_in_per_mtok: 5.00
        price_out_per_mtok: 15.00
        priority: 1
        enabled: true
