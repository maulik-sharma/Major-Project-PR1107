[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelmesh"
version = "0.1.0"
description = "Desktop LLM router client with multi-provider model pooling, baseline strategies, and transparent logging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "PyQt6>=6.7.0",
    "PyQt6-WebEngine>=6.7.0",
    "markdown>=3.6",
    "pygments>=2.18.0",
    "pypdf>=4.2.0",
]

[project.scripts]
modelmesh = "modelmesh.app:main"
modelmesh-cli = "modelmesh.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
